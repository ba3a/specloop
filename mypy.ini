[mypy]
files = kit/specloop/engine.py, install.py, tools
# engine.py has no annotations, and mypy skips the body of an unannotated function by default.
check_untyped_defs = True
# The pinned mypy needs 3.9 or newer here. Python 3.8 compatibility of the code is checked by
# tools/check_rules.py, not by mypy.
python_version = 3.9
# The engine branches on os.name at run time, which mypy does not follow. Fixing the platform keeps
# the result the same on every machine; without it, os.killpg is reported on Windows.
platform = linux
